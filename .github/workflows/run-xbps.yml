name: Void Linux XBPS Repository

# Publishes two R2 prefixes: danklinux/current (Dux Labs tools) and
# dms/current (dms-greeter, shared with dux-shell; guarded by publish-void-r2.sh).

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  repository_dispatch:
    types: [greeter-git, greeter-release]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build'
        type: choice
        required: false
        options:
          - all
          - dankcalendar
          - danksearch
          - dgop
          - dux-files
          - dms-greeter
          - dms-greeter-git
        default: 'all'
      force_rebuild:
        description: 'Force rebuilding packages even if they already exist in the repository'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: void-xbps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy XBPS packages (danklinux)
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'duxlabs-dev' &&
      github.event_name != 'repository_dispatch' &&
      !startsWith(github.event.inputs.package || 'all', 'dms-greeter')
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
      R2_BUCKET: danklinux-void
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_PREFIX: danklinux
      REPOSITORY_DIR: ${{ github.workspace }}/r2-repo
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record checked-out source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download current R2 repository
        run: |
          aws --version
          bash .github/scripts/publish-void-r2.sh download

      - name: Install XBPS Static Utilities
        run: |
          mkdir -p ${{ github.workspace }}/xbps
          curl -s -L https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz | tar -xJ -C ${{ github.workspace }}/xbps
          echo "${{ github.workspace }}/xbps/usr/bin" >> $GITHUB_PATH

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Inject templates
        run: |
          for pkg in distro/void/srcpkgs/*/; do
            case "$(basename "$pkg")" in
              dms-greeter|dms-greeter-git) continue ;;
            esac
            cp -R "$pkg" void-packages/srcpkgs/
          done

      - name: Enable unprivileged user namespaces (Ubuntu 24.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap xbps-src
        run: |
          cd void-packages
          ./xbps-src binary-bootstrap

      - name: Configure signing keys and trust
        run: |
          # Write private key; extract and register the public key for
          # host and chroot trust.
          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > /tmp/xbps_privkey.pem
          chmod 600 /tmp/xbps_privkey.pem

          openssl rsa -in /tmp/xbps_privkey.pem -pubout -out /tmp/dms-key.pub
          rm -f /tmp/xbps_privkey.pem   # cleaned up; re-written only for signing step

          sudo mkdir -p /var/db/xbps/keys
          sudo cp /tmp/dms-key.pub /var/db/xbps/keys/dms-key.pub

          mkdir -p void-packages/masterdir/var/db/xbps/keys
          cp /tmp/dms-key.pub void-packages/masterdir/var/db/xbps/keys/dms-key.pub
          rm -f /tmp/dms-key.pub

      - name: Configure repositories
        run: |
          # Add any existing compiled packages to the build cache directory to avoid rebuilds
          if [ -d "r2-repo/current" ]; then
            mkdir -p void-packages/hostdir/binpkgs
            cp -L r2-repo/current/*.xbps void-packages/hostdir/binpkgs/ 2>/dev/null || true
            xbps-rindex -a void-packages/hostdir/binpkgs/*.xbps 2>/dev/null || true
          fi

      - name: Build packages
        run: |
          mkdir -p r2-repo/current

          FORCE_REBUILD="${{ github.event.inputs.force_rebuild || 'false' }}"

          echo "=== Starting Builds ==="
          echo "Force rebuild:        $FORCE_REBUILD"
          echo "Package:              ${{ github.event.inputs.package || 'all' }}"

          cd void-packages

          PACKAGES=("dgop" "danksearch" "dankcalendar" "dux-files")
          SELECTED="${{ github.event.inputs.package || 'all' }}"
          if [ "$SELECTED" != "all" ]; then
            PACKAGES=("$SELECTED")
          fi

          for pkg in "${PACKAGES[@]}"; do
            # Read version/revision from template
            VER=$(grep -E '^version=' srcpkgs/$pkg/template | cut -d= -f2 | tr -d '"')
            REV=$(grep -E '^revision=' srcpkgs/$pkg/template | cut -d= -f2 | tr -d '"')

            EXPECTED_FILE="${pkg}-${VER}_${REV}.x86_64.xbps"
            if [ -f "../r2-repo/current/$EXPECTED_FILE" ] && [ "$FORCE_REBUILD" != "true" ]; then
              echo "✅ $EXPECTED_FILE already exists, skipping build."
            else
              echo "🔨 Compiling $pkg ($VER)..."
              ./xbps-src pkg "$pkg"
              # Delete any existing file/symlink first to ensure we write a regular file
              rm -f "../r2-repo/current/${EXPECTED_FILE}"
              cp -L "hostdir/binpkgs/${EXPECTED_FILE}" ../r2-repo/current/
            fi
          done

      - name: Index and sign repository
        run: |
          cd r2-repo/current

          rm -f *.sig


          # Guard: nothing to index if no .xbps files exist
          if ! ls *.xbps 1>/dev/null 2>&1; then
            echo "⚠️ No .xbps files found to index, skipping."
            exit 0
          fi

          # Regenerate repo index
          xbps-rindex -a $(pwd)/*.xbps
          xbps-rindex --remove-obsoletes $(pwd)

          # Remove signatures left behind by obsolete packages. Signatures for
          # unchanged immutable packages are retained byte-for-byte.
          for sig in *.sig2; do
            [ -e "$sig" ] || break
            [ -f "${sig%.sig2}" ] || rm -f "$sig"
          done

          # Sign repository
          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > /tmp/xbps_privkey.pem
          chmod 600 /tmp/xbps_privkey.pem

          xbps-rindex --sign --signedby "AvengeMedia <AvengeMedia.US@gmail.com>" --privkey /tmp/xbps_privkey.pem $(pwd)
          xbps-rindex --sign-pkg --privkey /tmp/xbps_privkey.pem $(pwd)/*.xbps

          rm -f /tmp/xbps_privkey.pem

      - name: Publish repository to R2
        run: bash .github/scripts/publish-void-r2.sh publish

  build-dms-prefix:
    name: Build & Deploy XBPS packages (dms-greeter → dms)
    runs-on: ubuntu-latest
    # dms-greeter / dms-greeter-git into the shared dms/current prefix
    if: >-
      github.repository_owner == 'duxlabs-dev' &&
      (github.event_name != 'workflow_dispatch' ||
       (github.event.inputs.package || 'all') == 'all' ||
       startsWith(github.event.inputs.package, 'dms-greeter'))
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
      R2_BUCKET: danklinux-void
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # Must stay `dms`: existing greeter installs only have this repo configured.
      R2_PREFIX: dms
      REPOSITORY_DIR: ${{ github.workspace }}/r2-repo-dms
      GREETER_SRC: ${{ github.workspace }}/greeter-src
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clone dux-greeter
        run: |
          # Full history: the snapshot version embeds the commit count.
          git clone --recurse-submodules https://github.com/duxlabs-dev/dux-greeter.git "$GREETER_SRC"
          echo "SOURCE_COMMIT=$(git -C "$GREETER_SRC" rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C "$GREETER_SRC" log -1 --oneline

      - name: Determine packages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TYPE: ${{ github.event.action }}
          SELECTED: ${{ github.event.inputs.package || 'all' }}
        run: |
          case "$EVENT_NAME" in
            repository_dispatch)
              case "$DISPATCH_TYPE" in
                greeter-git)     PACKAGES="dms-greeter-git" ;;
                greeter-release) PACKAGES="dms-greeter" ;;
                *) echo "Unknown dispatch type: $DISPATCH_TYPE" >&2; exit 1 ;;
              esac
              ;;
            workflow_dispatch)
              if [ "$SELECTED" = "all" ]; then
                PACKAGES="dms-greeter-git dms-greeter"
              else
                PACKAGES="$SELECTED"
              fi
              ;;
            *)
              PACKAGES="dms-greeter-git dms-greeter"
              ;;
          esac
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Packages to build: $PACKAGES"

      - name: Download current R2 repository
        run: |
          aws --version
          bash .github/scripts/publish-void-r2.sh download

      - name: Install XBPS Static Utilities
        run: |
          mkdir -p ${{ github.workspace }}/xbps
          curl -s -L https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz | tar -xJ -C ${{ github.workspace }}/xbps
          echo "${{ github.workspace }}/xbps/usr/bin" >> $GITHUB_PATH

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Inject greeter templates
        run: |
          cp -R distro/void/srcpkgs/dms-greeter void-packages/srcpkgs/
          cp -R distro/void/srcpkgs/dms-greeter-git void-packages/srcpkgs/

      - name: Enable unprivileged user namespaces (Ubuntu 24.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap xbps-src
        run: |
          cd void-packages
          ./xbps-src binary-bootstrap

      - name: Configure signing keys and trust
        run: |
          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > /tmp/xbps_privkey.pem
          chmod 600 /tmp/xbps_privkey.pem

          openssl rsa -in /tmp/xbps_privkey.pem -pubout -out /tmp/dms-key.pub
          rm -f /tmp/xbps_privkey.pem   # cleaned up; re-written only for signing step

          sudo mkdir -p /var/db/xbps/keys
          sudo cp /tmp/dms-key.pub /var/db/xbps/keys/dms-key.pub

          mkdir -p void-packages/masterdir/var/db/xbps/keys
          cp /tmp/dms-key.pub void-packages/masterdir/var/db/xbps/keys/dms-key.pub
          rm -f /tmp/dms-key.pub

      - name: Configure repositories
        run: |
          # Seed the build cache with published packages
          if [ -d "$REPOSITORY_DIR/current" ]; then
            mkdir -p void-packages/hostdir/binpkgs
            cp -L "$REPOSITORY_DIR"/current/*.xbps void-packages/hostdir/binpkgs/ 2>/dev/null || true
            xbps-rindex -a void-packages/hostdir/binpkgs/*.xbps 2>/dev/null || true
          fi

      - name: Build packages
        id: build
        env:
          VOID_PACKAGES_DIR: ${{ github.workspace }}/void-packages
          PACKAGES: ${{ steps.plan.outputs.packages }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          mkdir -p "$REPOSITORY_DIR/current"
          BEFORE="$(ls "$REPOSITORY_DIR"/current/*.xbps 2>/dev/null | sort)"
          FORCE_ARGS=()
          if [ "$FORCE_REBUILD" = "true" ]; then
            FORCE_ARGS+=(--force)
          fi

          echo "=== Starting Builds ==="
          echo "Force rebuild:        $FORCE_REBUILD"
          echo "Packages:             $PACKAGES"
          echo "Greeter commit:       $SOURCE_COMMIT"

          for pkg in $PACKAGES; do
            echo "=========================================="
            echo "Building $pkg"
            echo "=========================================="
            bash distro/scripts/void/void-build.sh "$pkg" \
              --source-dir="$GREETER_SRC" "${FORCE_ARGS[@]}"
          done

          # Publish only when something was built; a no-op republish would churn the shared index.
          AFTER="$(ls "$REPOSITORY_DIR"/current/*.xbps 2>/dev/null | sort)"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No new packages built; skipping index and publish."
          fi

      - name: Index and sign repository
        if: steps.build.outputs.built == 'true'
        run: |
          cd "$REPOSITORY_DIR/current"

          rm -f *.sig

          # Guard: nothing to index if no .xbps files exist
          if ! ls *.xbps 1>/dev/null 2>&1; then
            echo "⚠️ No .xbps files found to index, skipping."
            exit 0
          fi

          # Regenerate repo index
          xbps-rindex -a $(pwd)/*.xbps
          xbps-rindex --remove-obsoletes $(pwd)

          # Remove signatures left behind by obsolete packages. Signatures for
          # unchanged immutable packages are retained byte-for-byte.
          for sig in *.sig2; do
            [ -e "$sig" ] || break
            [ -f "${sig%.sig2}" ] || rm -f "$sig"
          done

          # Sign repository
          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > /tmp/xbps_privkey.pem
          chmod 600 /tmp/xbps_privkey.pem

          xbps-rindex --sign --signedby "AvengeMedia <AvengeMedia.US@gmail.com>" --privkey /tmp/xbps_privkey.pem $(pwd)
          xbps-rindex --sign-pkg --privkey /tmp/xbps_privkey.pem $(pwd)/*.xbps

          rm -f /tmp/xbps_privkey.pem

      - name: Publish repository to R2
        if: steps.build.outputs.built == 'true'
        run: bash .github/scripts/publish-void-r2.sh publish
